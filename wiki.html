<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>삼국지 3D 택티컬 머지 디펜스 — 공식 위키 & 3D DB (HELLSCRIPT-Wiki Architecture)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-deep: #050811;
      --bg-panel: #0b1120;
      --bg-card: #111a2e;
      --border: rgba(56, 189, 248, 0.25);
      --gold: #fbbf24;
      --cyan: #38bdf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    /* 상단 헤더 (HELLSCRIPT-Wiki 스타일) */
    #wiki-header {
      height: 58px;
      background: rgba(8, 13, 26, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 40;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    #drawer-toggle {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--gold);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-title { font-size: 15px; font-weight: 900; color: var(--gold); letter-spacing: -0.3px; }
    .brand-sub { display: block; font-size: 10px; color: var(--cyan); font-weight: 700; letter-spacing: 0.6px; }
    .search-wrap { flex: 1; max-width: 420px; position: relative; }
    #wiki-search {
      width: 100%;
      background: #070c18;
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    #wiki-search:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(56, 189, 248, 0.25); }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .sync-pill {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fde68a;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .return-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid var(--cyan);
      color: #fff;
      text-decoration: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* 메인 워크스페이스 (좌측 Aside 트리 + 우측 Main 뷰어) */
    .wiki-workspace {
      display: flex;
      flex: 1;
      min-height: calc(100dvh - 58px);
    }
    #wiki-sidebar {
      width: 270px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
    }
    .mode-tab {
      text-align: center;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      background: #070b14;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      text-decoration: none;
    }
    .mode-tab.active {
      color: #fff;
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }
    #sidebar-tree {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .tree-group-title {
      font-size: 10px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.8px;
      margin: 10px 4px 4px;
      text-transform: uppercase;
    }
    .tree-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 6px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .tree-link:hover { background: rgba(255, 255, 255, 0.04); color: #fff; }
    .tree-link.active {
      background: rgba(251, 191, 36, 0.14);
      border-color: rgba(251, 191, 36, 0.45);
      color: var(--gold);
      font-weight: 800;
    }
    .sidebar-footer {
      padding: 10px 12px;
      font-size: 10px;
      color: #64748b;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      text-align: center;
    }

    /* 우측 본문 영역 */
    #wiki-main {
      flex: 1;
      padding: 24px 28px 60px;
      overflow-y: auto;
      max-width: 1180px;
    }
    .breadcrumb {
      font-size: 12px;
      color: var(--cyan);
      margin-bottom: 10px;
      font-weight: 700;
    }
    .article-layout {
      display: grid;
      grid-template-columns: 1fr 250px;
      gap: 24px;
      align-items: start;
    }
    .article-body {
      background: rgba(11, 17, 32, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      padding: 24px;
    }
    .article-body h1 {
      font-size: 24px;
      color: var(--gold);
      margin-bottom: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(251, 191, 36, 0.3);
    }
    .article-body h2 {
      font-size: 17px;
      color: var(--cyan);
      margin: 22px 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .article-body p, .article-body li {
      font-size: 14px;
      line-height: 1.7;
      color: #dbeafe;
      margin-bottom: 8px;
    }
    .article-body ul { padding-left: 20px; margin-bottom: 14px; }
    .wiki-table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0 20px;
      font-size: 13px;
    }
    .wiki-table th, .wiki-table td {
      border: 1px solid rgba(148, 163, 184, 0.22);
      padding: 9px 12px;
      text-align: left;
    }
    .wiki-table th {
      background: #0f172a;
      color: var(--gold);
      font-weight: 800;
    }
    .wiki-table tr:nth-child(even) { background: rgba(15, 23, 42, 0.45); }

    /* 우측 인포박스 / TOC */
    .article-aside {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      position: sticky;
      top: 78px;
    }
    .aside-title {
      font-size: 12px;
      font-weight: 900;
      color: var(--gold);
      border-bottom: 1px solid rgba(251, 191, 36, 0.3);
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    .toc-list { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
    .toc-list a { color: #cbd5e1; text-decoration: none; }
    .toc-list a:hover { color: var(--cyan); }

    /* DB 필터 바 & 카드 그리드 */
    .db-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 14px 0 18px;
      padding: 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .filter-btn {
      background: #070b14;
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .filter-btn.active {
      background: rgba(251, 191, 36, 0.18);
      border-color: var(--gold);
      color: var(--gold);
    }
    .db-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 12px;
    }
    .db-card {
      background: var(--bg-card);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .db-card:hover {
      transform: translateY(-3px);
      border-color: var(--cyan);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }
    .db-card.unlocked { border-color: rgba(251, 191, 36, 0.65); }
    .unlock-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
    }
    .unlock-tag.yes { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .unlock-tag.no { background: rgba(15, 23, 42, 0.8); color: #64748b; border: 1px solid #334155; }
    .card-banner-canvas {
      width: 64px;
      height: 110px;
      border-radius: 4px;
      margin-bottom: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.45);
    }
    .card-title { font-size: 14px; font-weight: 800; color: #fff; }
    .card-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .card-stamp {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #fde047;
      background: rgba(127, 29, 29, 0.75);
      border: 1px solid #ef4444;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: serif;
    }

    /* 사운드 & 낙관 시연 버튼 */
    .demo-btn {
      background: linear-gradient(135deg, #b91c1c, #7f1d1d);
      border: 1px solid var(--gold);
      color: #fef08a;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      margin: 4px 4px 4px 0;
    }
    .demo-btn:active { transform: scale(0.95); }

    /* <dialog> 3D 장수 상세 모달 (HELLSCRIPT-Wiki 아키텍처) */
    #hero-dialog {
      margin: auto;
      background: #0b1120;
      color: var(--text-main);
      border: 2px solid var(--gold);
      border-radius: 14px;
      width: 92%;
      max-width: 680px;
      padding: 0;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
    }
    #hero-dialog::backdrop {
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(6px);
    }
    .dialog-inner {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 360px;
    }
    #dialog-3d-stage {
      background: radial-gradient(circle at 50% 50%, #1e293b 0%, #050811 100%);
      position: relative;
      min-height: 300px;
      border-right: 1px solid var(--border);
      cursor: grab;
    }
    .stage-hint {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      color: var(--cyan);
      pointer-events: none;
    }
    .dialog-info { padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .dialog-close {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }

    /* 한자 사자성어 낙관 시연 오버레이 */
    #wiki-stamp-overlay {
      position: fixed;
      top: 24%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 100;
      pointer-events: none;
      transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s;
    }
    .stamp-hidden {
      opacity: 0;
      transform: translate(-50%, -50%) scale(2.5) !important;
    }
    .stamp-box {
      background: rgba(127, 29, 29, 0.95);
      border: 3px double var(--gold);
      outline: 2px solid #ef4444;
      padding: 10px 22px;
      border-radius: 8px;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.85);
      text-align: center;
      transform: rotate(-4deg);
    }
    .stamp-hanja { font-size: 32px; font-weight: 900; color: #fef08a; letter-spacing: 5px; font-family: serif; }
    .stamp-sub { font-size: 12px; font-weight: 800; color: #fecaca; margin-top: 4px; }

    @media (max-width: 860px) {
      #drawer-toggle { display: inline-block; }
      #wiki-sidebar {
        position: fixed;
        top: 58px;
        bottom: 0;
        left: 0;
        z-index: 35;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
      }
      #wiki-sidebar.open { transform: translateX(0); }
      .article-layout { grid-template-columns: 1fr; }
      .dialog-inner { grid-template-columns: 1fr; }
      #dialog-3d-stage { height: 240px; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header id="wiki-header">
    <div class="header-left">
      <button id="drawer-toggle" aria-label="메뉴 열기">☰</button>
      <a href="#/tree/overview" class="brand">
        <canvas id="wiki-logo" width="34" height="34"></canvas>
        <div>
          <span class="brand-title">삼국지 3D 머지 디펜스</span>
          <span class="brand-sub">HELLSCRIPT-STYLE PUBLIC WIKI & 3D DB</span>
        </div>
      </a>
    </div>
    <div class="search-wrap">
      <input type="search" id="wiki-search" placeholder="장수명, 한자(關/呂), 사자성어 낙관, 책략 검색... ( / 키)">
    </div>
    <div class="header-right">
      <span id="sync-badge" class="sync-pill">📖 도감 동기화: 0/28</span>
      <a href="index.html" class="return-btn">🎮 전장 복귀</a>
    </div>
  </header>

  <div class="wiki-workspace">
    <aside id="wiki-sidebar" aria-label="위키와 데이터베이스 탐색">
      <nav class="mode-switch">
        <a href="#/tree/overview" class="mode-tab" id="tab-tree">📖 전술 위키</a>
        <a href="#/db/heroes" class="mode-tab" id="tab-db">🗂️ 리소스·DB</a>
      </nav>
      <nav id="sidebar-tree" aria-label="문서 트리 목록"></nav>
      <div class="sidebar-footer">ARGON.3K // ZERO-VOICE & ZERO-ASSET</div>
    </aside>

    <main id="wiki-main"></main>
  </div>

  <!-- 한자 낙관 시연 오버레이 -->
  <div id="wiki-stamp-overlay" class="stamp-hidden">
    <div class="stamp-box">
      <div class="stamp-hanja" id="wiki-stamp-hanja">義薄雲天</div>
      <div class="stamp-sub" id="wiki-stamp-sub">무성 관우 낙관 시연</div>
    </div>
  </div>

  <!-- 3D 장수 피규어 360도 프리뷰 모달 -->
  <dialog id="hero-dialog">
    <div class="dialog-inner">
      <div id="dialog-3d-stage">
        <div class="stage-hint">🔄 드래그하여 3D 장수 & 한자 군기 360° 회전</div>
      </div>
      <div class="dialog-info" id="dialog-info-box"></div>
    </div>
  </dialog>

  <script src="wiki.js"></script>
</body>
</html>
