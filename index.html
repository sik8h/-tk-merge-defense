<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>삼국지 3D 택티컬 머지 디펜스 - Argon 3D Character Rig</title>
<link rel="stylesheet" href="style.css">
<!-- Three.js & PostProcessing CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
<div id="app-container">
<!-- Tactical Telemetry HUD -->
<header id="hud">
<div class="hud-top">
<div class="telemetry-tag">3D RIG // THREE KINGDOMS</div>
<div id="wave-title" class="hud-box">제1장 황건적의 난</div>
<div class="hud-controls">
<button id="cam-btn" class="hud-btn" title="카메라 시점 전환">🎥 쿼터뷰</button>
<button id="sound-btn" class="hud-btn">🔊</button>
</div>
</div>
<div class="hud-stats">
<div class="stat-item"><span class="label">군량미</span><span class="val">🌾 <b id="gold-val">100</b></span></div>
<div class="stat-item"><span class="label">호로관 내구도</span><span class="val">🏯 <b id="hp-val">100/100</b></span></div>
<div class="stat-item"><span class="label">격파</span><span class="val">⚔️ <b id="kill-val">0</b></span></div>
<div class="stat-item"><span class="label">화력(DPS)</span><span class="val">⚡ <b id="dps-val">0</b></span></div>
</div>
<div id="synergy-bar">
<span id="syn-shu" class="syn-badge">촉(공속+25%) 0/3</span>
<span id="syn-wei" class="syn-badge">위(화력+15%) 0/2</span>
<span id="syn-qun" class="syn-badge">군웅(치명+25%) 0/3</span>
</div>
<div id="gate-hp-bar-container">
<div id="gate-hp-bar"></div>
</div>
</header>

<!-- 3D WebGL Viewport + 2D HUD Overlay Canvas -->
<main id="game-view">
<div id="webgl-container"></div>
<canvas id="hudCanvas"></canvas>
<!-- Unit Inspector Telemetry Panel -->
<div id="unit-inspector" class="hidden">
<div class="insp-left">
<div class="insp-title" id="insp-name">관우 [Tier 5]</div>
<div class="insp-sub" id="insp-desc">청룡언월도 검기 파동</div>
</div>
<div class="insp-metrics">
<span>공격: <b id="insp-atk">450</b></span>
<span>공속: <b id="insp-spd">0.95/s</b></span>
</div>
</div>
</main>

<!-- Tactical Command Bar -->
<footer id="command-bar">
<button id="recruit-btn" class="cmd-btn recruit">
<span class="btn-title">장수 모집</span>
<span class="btn-sub"><span id="recruit-cost">20</span> 🌾 (대박확률)</span>
</button>
<button id="upgrade-btn" class="cmd-btn upgrade">
<span class="btn-title">무력 강화 <small>Lv.<span id="upgrade-lvl">1</span></small></span>
<span class="btn-sub"><span id="upgrade-cost">30</span> 🌾 (+15%)</span>
</button>
<button id="skill-btn" class="cmd-btn skill">
<span class="btn-title">🔥 적벽 화공</span>
<span class="btn-sub" id="skill-cd">즉시 발동</span>
</button>
</footer>

<!-- Roguelike Strategy Modal -->
<div id="strategy-modal" class="modal hidden">
<div class="modal-content">
<div class="modal-header">
<h2>🪶 제갈량의 금낭묘계 🪶</h2>
<p>전술 코어를 업그레이드할 책략을 선택하십시오.</p>
</div>
<div id="strategy-cards" class="card-container"></div>
</div>
</div>

<!-- Game Over Modal -->
<div id="gameover-modal" class="modal hidden">
<div class="modal-content text-center">
<h1 id="gameover-title" style="color:#ef4444; margin-bottom:6px;">호로관 함락!</h1>
<p id="gameover-subtitle" style="color:#94a3b8; font-size:13px;">방어선이 돌파당했습니다.</p>
<div class="final-stats">
<p>최종 도달: <strong id="final-wave" style="color:#fde047;">제1장</strong></p>
<p>적 처치 수: <strong id="final-kills" style="color:#38bdf8;">0</strong>명</p>
</div>
<button id="restart-btn" class="modal-action-btn">전장 재가동</button>
</div>
</div>
</div>
<script src="game.js"></script>
</body>
</html>
