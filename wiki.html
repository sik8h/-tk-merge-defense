<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>삼국지 3D 택티컬 머지 디펜스 — 공식 전술 기록원 & 3D 명장 도감</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-base: #11151c;
      --bg-panel: #171c26;
      --bg-card: #1e2533;
      --bg-hover: #262f40;
      --border: #2e384b;
      --gold: #d4af37;
      --gold-soft: #e5c76b;
      --jade: #3d8b6e;
      --accent: #5b8fb9;
      --text-main: #e6e1d6;
      --text-sub: #9aa5b4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    #wiki-header {
      height: 58px;
      background: #141923;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 40;
      gap: 12px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    #drawer-toggle {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--gold);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-main); }
    .brand-title { font-size: 15px; font-weight: 800; color: var(--gold); }
    .brand-sub { display: block; font-size: 10px; color: var(--text-sub); font-weight: 600; }
    .search-wrap { flex: 1; max-width: 380px; }
    #wiki-search {
      width: 100%;
      background: #0d1017;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    #wiki-search:focus { border-color: var(--gold); }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .sync-pill {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.4);
      color: var(--gold-soft);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .return-btn {
      background: #2b4c6f;
      border: 1px solid #4a75a0;
      color: #fff;
      text-decoration: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .wiki-workspace { display: flex; flex: 1; min-height: calc(100dvh - 58px); }
    #wiki-sidebar {
      width: 260px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .mode-tab {
      text-align: center;
      padding: 8px 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
    }
    .mode-tab.active {
      color: var(--gold-soft);
      background: var(--bg-card);
      border-color: var(--gold);
    }
    #sidebar-tree {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .tree-group-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
      margin: 10px 4px 4px;
    }
    .tree-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid transparent;
    }
    .tree-link:hover { background: var(--bg-hover); color: var(--text-main); }
    .tree-link.active {
      background: rgba(212, 175, 55, 0.12);
      border-color: rgba(212, 175, 55, 0.4);
      color: var(--gold-soft);
      font-weight: 700;
    }
    .sidebar-footer {
      padding: 10px 12px;
      font-size: 11px;
      color: var(--text-sub);
      border-top: 1px solid var(--border);
      text-align: center;
    }
    #wiki-main {
      flex: 1;
      padding: 22px 26px 60px;
      overflow-y: auto;
      max-width: 1180px;
    }
    .breadcrumb { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; font-weight: 700; }
    .article-layout { display: grid; grid-template-columns: 1fr 240px; gap: 20px; align-items: start; }
    .article-body {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 22px;
    }
    .article-body h1 {
      font-size: 22px;
      color: var(--gold-soft);
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .article-body h2 { font-size: 16px; color: #8ab4d6; margin: 20px 0 8px; }
    .article-body p, .article-body li { font-size: 14px; line-height: 1.7; color: var(--text-main); margin-bottom: 8px; }
    .article-body ul { padding-left: 20px; margin-bottom: 12px; }
    .wiki-table { width: 100%; border-collapse: collapse; margin: 10px 0 18px; font-size: 13px; }
    .wiki-table th, .wiki-table td { border: 1px solid var(--border); padding: 9px 11px; text-align: left; }
    .wiki-table th { background: #121720; color: var(--gold-soft); font-weight: 700; }
    .wiki-table tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }
    .article-aside {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      position: sticky;
      top: 76px;
    }
    .aside-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--gold);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .toc-list { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
    .toc-list a { color: var(--text-sub); text-decoration: none; }
    .toc-list a:hover { color: var(--gold-soft); }
    .db-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0 16px;
      padding: 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .filter-btn {
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .filter-btn.active {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold);
      color: var(--gold-soft);
      font-weight: 700;
    }
    .db-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
      gap: 14px;
    }
    .db-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }
    .db-card:hover { transform: translateY(-2px); border-color: var(--gold); background: var(--bg-hover); }
    .db-card.unlocked { border-color: rgba(212, 175, 55, 0.55); }
    .unlock-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    .unlock-tag.yes { background: rgba(61, 139, 110, 0.25); color: #6ee7b7; border: 1px solid var(--jade); }
    .unlock-tag.no { background: #141923; color: var(--text-sub); border: 1px solid var(--border); }
    .portrait-canvas {
      width: 110px;
      height: 128px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      background: #12161f;
    }
    .card-title { font-size: 15px; font-weight: 800; color: var(--text-main); }
    .card-sub { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
    .card-meta {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.22);
      padding: 5px 6px;
      border-radius: 6px;
      margin-top: 6px;
      color: #cbd5e1;
    }
    .card-lib-info { font-size: 10px; color: var(--gold-soft); margin-top: 5px; font-weight: 600; }
    .card-stamp {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 800;
      color: #f3e5ab;
      background: #4a1c1c;
      border: 1px solid #8c3b3b;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: serif;
    }
    .demo-btn {
      background: #4a2121;
      border: 1px solid var(--gold);
      color: var(--gold-soft);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin: 4px 4px 4px 0;
    }
    #hero-dialog {
      margin: auto;
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--gold);
      border-radius: 12px;
      width: 94%;
      max-width: 740px;
      padding: 0;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
    }
    #hero-dialog::backdrop { background: rgba(8, 10, 15, 0.78); backdrop-filter: blur(4px); }
    .dialog-inner { display: grid; grid-template-columns: 310px 1fr; min-height: 410px; }
    #dialog-3d-stage {
      background: radial-gradient(circle at 50% 45%, #252f42 0%, #11151c 100%);
      position: relative;
      min-height: 340px;
      border-right: 1px solid var(--border);
      cursor: grab;
    }
    .stage-hint {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: var(--gold-soft);
      pointer-events: none;
    }
    .dialog-info { padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
    .dialog-close {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 9px 14px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    #wiki-stamp-overlay {
      position: fixed;
      top: 24%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 100;
      pointer-events: none;
      transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s;
    }
    .stamp-hidden { opacity: 0; transform: translate(-50%, -50%) scale(2.4) !important; }
    .stamp-box {
      background: rgba(105, 28, 28, 0.96);
      border: 2px solid var(--gold);
      padding: 10px 22px;
      border-radius: 6px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      text-align: center;
      transform: rotate(-3deg);
    }
    .stamp-hanja { font-size: 30px; font-weight: 900; color: #f3e5ab; letter-spacing: 5px; font-family: serif; }
    .stamp-sub { font-size: 12px; font-weight: 700; color: #e6e1d6; margin-top: 4px; }
    @media (max-width: 860px) {
      #drawer-toggle { display: inline-block; }
      #wiki-sidebar {
        position: fixed;
        top: 58px;
        bottom: 0;
        left: 0;
        z-index: 35;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
      }
      #wiki-sidebar.open { transform: translateX(0); }
      .article-layout { grid-template-columns: 1fr; }
      .dialog-inner { grid-template-columns: 1fr; }
      #dialog-3d-stage { height: 270px; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
<!-- Oriental Sumi-e Ink-Wash SVG Filters -->
<svg style="position:absolute; width:0; height:0; pointer-events:none;" aria-hidden="true">
  <defs>
    <filter id="ink-brush-filter" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" result="inkNoise" />
      <feDisplacementMap in="SourceGraphic" in2="inkNoise" scale="2.8" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>
  <header id="wiki-header">
    <div class="header-left">
      <button id="drawer-toggle" aria-label="메뉴 열기">☰</button>
      <a href="#/tree/overview" class="brand">
        <canvas id="wiki-logo" width="34" height="34"></canvas>
        <div>
          <span class="brand-title">삼국지 3D 무쌍 방어전 기록원</span>
          <span class="brand-sub">ORIENTAL ARCHIVE & 18-PART 3D HERO DB</span>
        </div>
      </a>
    </div>
    <div class="search-wrap">
      <input type="search" id="wiki-search" placeholder="장수명, 한자(關/呂), 무기(청룡언월도), 인연, 해방장수 검색...">
    </div>
    <div class="header-right">
      <span id="sync-badge" class="sync-pill">📖 해방 명장: 0 / 120</span>
      <span id="bond-badge" class="sync-pill">🤝 활성 인연: 0 / 20</span>
      <span id="gov-badge" class="sync-pill">🗺️ 파견 태수: 0 / 18</span>
      <span id="upgrade-badge" class="sync-pill">⚔️ 장수 성장: 0</span>
      <a href="index.html" class="return-btn">🎮 전장 복귀</a>
    </div>
  </header>

  <div class="wiki-workspace">
    <aside id="wiki-sidebar" aria-label="위키와 데이터베이스 탐색">
      <nav class="mode-switch">
        <a href="#/tree/overview" class="mode-tab" id="tab-tree">📖 전술 문서</a>
        <a href="#/db/heroes" class="mode-tab" id="tab-db">🗂️ 통합 도감·DB</a>
      </nav>
      <nav id="sidebar-tree" aria-label="문서 목록"></nav>
      <div class="sidebar-footer">수묵·금석 다크 테마 // ZERO-VOICE</div>
    </aside>
    <main id="wiki-main"></main>
  </div>

  <div id="wiki-stamp-overlay" class="stamp-hidden">
    <div class="stamp-box">
      <div class="stamp-hanja" id="wiki-stamp-hanja">義薄雲天</div>
      <div class="stamp-sub" id="wiki-stamp-sub">무성 관우 낙관 시연</div>
    </div>
  </div>

  <dialog id="hero-dialog">
    <div class="dialog-inner">
      <div id="dialog-3d-stage">
        <div class="stage-hint">🔄 드래그하여 18파츠 3D 장수·무기·탈것 360° 회전</div>
      </div>
      <div class="dialog-info" id="dialog-info-box"></div>
    </div>
  </dialog>

  <script src="wiki.js"></script>
</body>
</html>
